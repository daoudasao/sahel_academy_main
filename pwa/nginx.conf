# Sert la PWA Flutter (build web) : fallback SPA + cache maîtrisé.
server {
  listen       80;
  listen       [::]:80;
  server_name  _;

  root   /usr/share/nginx/html;
  index  index.html;

  # (Le type application/wasm pour CanvasKit est déjà présent dans les
  #  mime.types de nginx 1.27, inclus globalement.)

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
  gzip_min_length 1024;

  # ── Points d'entrée : toujours revalidés (comme sur Firebase) ──
  # Une mise à jour est prise au rechargement suivant, sans PWA figée.
  location = /index.html               { add_header Cache-Control "no-cache"; }
  location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }
  location = /sw.js                     { add_header Cache-Control "no-cache"; }
  location = /main.dart.js             { add_header Cache-Control "no-cache"; }
  location = /flutter_bootstrap.js     { add_header Cache-Control "no-cache"; }
  location = /manifest.json            { add_header Cache-Control "no-cache"; }
  location = /version.json             { add_header Cache-Control "no-cache"; }

  # ── Fichiers d'association (liens profonds), servis en JSON ──
  location = /.well-known/assetlinks.json {
    default_type application/json;
    add_header Cache-Control "no-cache";
  }
  location = /.well-known/apple-app-site-association {
    default_type application/json;
    add_header Cache-Control "no-cache";
  }

  # ── Ressources versionnées (immuables) : cache long ──
  location /assets/    { expires 30d; add_header Cache-Control "public, max-age=2592000"; try_files $uri =404; }
  location /canvaskit/ { expires 30d; add_header Cache-Control "public, max-age=2592000"; try_files $uri =404; }
  location /icons/     { expires 7d;  add_header Cache-Control "public, max-age=604800";  try_files $uri =404; }

  # ── Fallback SPA (URLs propres : usePathUrlStrategy) ──
  location / {
    try_files $uri $uri/ /index.html;
  }
}
